<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A35D6"/>
      <stop offset="100%" stop-color="#6B1FA8"/>
    </linearGradient>
  </defs>

  <!-- Purple pill square background matching the 3D image exactly -->
  <rect width="240" height="240" rx="52" ry="52" fill="url(#bg)"/>

  <!--
    LETTER A
    - Wide, bold, clean sans-serif
    - Thick strokes (~20px)
    - Open at the bottom (no bottom crossbar on legs)
    - Single crossbar at mid-height
    - Centred in the square
  -->
  <path
    fill="white"
    fill-rule="evenodd"
    d="
      M 36 202
      L 83 44
      H 157
      L 204 202
      H 172
      L 162 172
      H 78
      L 68 202
      Z

      M 88 148
      H 152
      L 120 72
      Z
    "
  />

  <!--
    LIGHTNING BOLT
    - Sits INSIDE the open triangle of the A
    - Top-right to bottom-left diagonal
    - Compact — does not extend outside the A's inner triangle
    - Two-part: upper wide section + lower narrow point
  -->
  <path
    fill="white"
    d="
      M 142 70
      L 110 118
      H 128
      L 96 172
      L 148 114
      H 130
      Z
    "
  />
</svg>
